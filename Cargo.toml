[package]
name = "cdd-publisher"
version = "0.0.1"
edition = "2024"
description = "CDD Publisher"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/cdd-publisher"
keywords = ["cdd", "publisher"]
categories = ["development-tools"]

[dependencies]
derive_more = { version = "2.1", default-features = false, features = ["as_ref", "display", "error", "from", "into", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
redis = { version = "1.7", default-features = false, features = ["streams", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tar = { version = "0.4", default-features = false }
tempfile = { version = "3.27", default-features = false }
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }

[lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(coverage)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
multiple_crate_versions = "allow"

[dev-dependencies]
wiremock = { version = "0.6", default-features = false }
